# The Chapter 1 demo of the quest, on its own (owner decision, Oct 16: this repository holds only the quest).
# Tests run first, so a broken change never reaches a tester. A commit with [skip netlify] does not build.
[build]
  command = "npm ci && npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
